[program:php-vibe-coding-frame_queue_worker]
command=/usr/bin/php /var/www/php-vibe-coding-frame/public/cli.php queue:worker --tube_key=default --memory_limit=10485760
process_name=%(program_name)s_%(process_num)s
numprocs=5
stopwaitsecs=60
restart=always
redirect_stderr=true
stdout_logfile=/var/log/php-vibe-coding-frame/queue_worker.log
stdout_logfile_maxbytes=10MB
user=www-data
