server {
    listen 80;
    root /var/www/php-vibe-coding-frame/public;
    index index.php;
    charset utf-8;
    sendfile off;

    gzip on;
    gzip_min_length 1k;
    gzip_buffers 4 16k;
    gzip_comp_level 2;
    gzip_types application/json;
    gzip_vary on;
    gzip_disable "MSIE [1-6]\.";

    location = /CLAUDE.md {
        deny all;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location /assets/ {
        expires 30d;
        access_log off;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    location ~ \.php$ {
        fastcgi_pass unix:/var/run/php-fpm.sock;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_intercept_errors off;
    }

    # SSE 分流：与普通请求一样走 php-fpm（public/sse.php），每请求一个流
    location ^~ /sse/ {
        include fastcgi_params;
        fastcgi_pass unix:/var/run/php-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root/sse.php;
        fastcgi_buffering off;      # 必须：否则缓存整个流
        fastcgi_read_timeout 3600s; # 放宽：长流无数据超时，配合 handler 频繁 yield
        gzip off;                   # 必须：gzip 缓冲破坏流式
    }
}
