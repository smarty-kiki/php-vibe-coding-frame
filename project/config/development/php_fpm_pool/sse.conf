; SSE 独立 pool：承接 /sse/* 长流请求（AI 逐字返回、长任务进度）
; 每路 SSE 连接独占一个 worker 直到流结束，独立 pool 隔离长流，避免占用普通请求的 worker
; 参考 /etc/php/8.4/fpm/pool.d/www.conf 的配置风格
[sse]

; Unix user/group（与 www pool 一致）
user = www-data
group = www-data

; 独立 unix socket，nginx /sse/ location 的 fastcgi_pass 指到这里
listen = /var/run/php-fpm-sse.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

; 进程管理：ondemand 模式——SSE 是长连接，平时不养空闲 worker，有连接才拉起，空闲自动回收
pm = ondemand
pm.max_children = 20
pm.process_idle_timeout = 10s

; 长流不能被执行超时杀掉（默认 0，这里显式声明保证 SSE 流不被强制终止）
request_terminate_timeout = 0

; 只允许解析 .php 脚本
security.limit_extensions = .php

; worker 输出并入主错误日志，便于排查 SSE 流中的异常输出
catch_workers_output = yes
