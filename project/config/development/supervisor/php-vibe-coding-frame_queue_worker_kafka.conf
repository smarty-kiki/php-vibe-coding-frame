# kafka 队列的 worker 模板（与 beanstalk 版 queue_worker 并列，二选一启用）：
# 项目的队列实现（bootstrap.php）用 queue_kafka.php 时，把 before_env_start.sh 里的软链换成本文件。
# stopwaitsecs 给足「一次消费等待 + 离组提交」的时间：SIGTERM 后 worker 最多要等一轮 consume 超时才退出
[program:php-vibe-coding-frame_queue_worker_kafka]
command=/usr/bin/php /var/www/php-vibe-coding-frame/public/cli.php queue:worker --topic_key=default --memory_limit=10485760
environment= ENV="development";
process_name=%(program_name)s_%(process_num)s
numprocs=5
stopwaitsecs=15
restart=always
user=root
