# ---- 全链路 trace ----
# trace_id 的选取：客户端传了就用客户端的（traceparent > X-Request-Id），都没有才用 $request_id 自生成；
# 判定正则与 PHP 侧（frame/trace.php 的 trace_begin_request）逐字对齐，保证 access log 与 PHP 日志的 trace_id 逐字符一致
map $http_traceparent $trace_id_from_traceparent {
    default                               "";
    "~*^[0-9a-f]{2}-([0-9a-f]{32})-.*$"    $1;
}

map $http_x_request_id $trace_id_from_x_request_id {
    default                 "";
    "~*^([0-9a-f]{32})$"     $1;
}

map $trace_id_from_traceparent $trace_id_or_client {
    default          $trace_id_from_x_request_id;
    "~^(.{32})$"     $1;
}

map $trace_id_or_client $trace_id {
    default          $request_id;
    "~^(.{32})$"     $1;
}

# JSON 格式 access log：escape=json 必加，否则 URI/UA 里的引号会破坏 JSON 结构
log_format json_trace escape=json
    '{"@timestamp":"$time_iso8601",'
    '"service":"php-vibe-coding-frame",'
    '"env":"development",'
    '"host":"$hostname",'
    '"trace_id":"$trace_id",'
    '"remote_addr":"$remote_addr",'
    '"method":"$request_method",'
    '"uri":"$request_uri",'
    '"status":$status,'
    '"body_bytes":$body_bytes_sent,'
    '"request_time_s":$request_time,'
    '"upstream_time":"$upstream_response_time",'
    '"upstream_addr":"$upstream_addr",'
    '"referer":"$http_referer",'
    '"ua":"$http_user_agent"}';

server {
    listen 80;
    root /var/www/php-vibe-coding-frame/public;
    index index.php;
    charset utf-8;
    sendfile off;

    # 全链路 trace：access log 改 JSON（server 级替换继承的 http 级日志，不会双写）
    access_log /var/log/nginx/access.log json_trace;

    # 响应头由 nginx 回写（含 502、静态 404、403 deny 等未进 PHP 的响应）；
    # fastcgi_hide_header 隐藏 PHP 回写的同名头，避免响应里出现两份
    add_header X-Request-Id $trace_id always;
    fastcgi_hide_header X-Request-Id;

    gzip on;
    gzip_min_length 1k;
    gzip_buffers 4 16k;
    gzip_comp_level 2;
    gzip_types application/json;
    gzip_vary on;
    gzip_disable "MSIE [1-6]\.";

    location = /CLAUDE.md {
        deny all;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location /assets/ {
        expires 30d;
        access_log off;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    location ~ \.php$ {
        fastcgi_pass unix:/var/run/php-fpm.sock;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param ENV 'development';
        fastcgi_param HTTP_X_REQUEST_ID $trace_id;
        fastcgi_intercept_errors off;
    }

    # API 分流：页面入口只出页面，/api/* 由本入口只出 JSON（走普通 php-fpm worker，非 sse 长流 pool）
    location ^~ /api/ {
        include fastcgi_params;
        fastcgi_pass unix:/var/run/php-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root/api.php;
        fastcgi_param ENV 'development';
        fastcgi_param HTTP_X_REQUEST_ID $trace_id;
    }

    # SSE 分流：独立 fpm pool（php_fpm_pool/sse.conf）承接长流，每请求一个流，不占普通 worker
    location ^~ /sse/ {
        include fastcgi_params;
        fastcgi_pass unix:/var/run/php-fpm-sse.sock;
        fastcgi_param SCRIPT_FILENAME $document_root/sse.php;
        fastcgi_param ENV 'development';
        fastcgi_param HTTP_X_REQUEST_ID $trace_id;
        fastcgi_buffering off;      # 必须：否则缓存整个流
        fastcgi_read_timeout 3600s; # 放宽：长流无数据超时，配合 handler 频繁 yield
        gzip off;                   # 必须：gzip 缓冲破坏流式
    }
}
